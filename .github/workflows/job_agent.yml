name: Job Search Agent

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - run
          - self-test
          - dry-run
        default: run

permissions:
  contents: write

# Never let the two daily runs overlap and race on jobs_log.csv.
concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # Reasoning models (deepseek-v4-pro) can take ~30s per posting, so allow
    # headroom well past the fast-model path.
    timeout-minutes: 40
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job agent
        env:
          # Primary engine. This was missing from the workflow, so DeepSeek
          # was never actually used despite being the documented default.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Cheap, fast model scores every posting.
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          # Stronger model rewrites the outreach for scoring matches only.
          DEEPSEEK_DRAFT_MODEL: ${{ vars.DEEPSEEK_DRAFT_MODEL || 'deepseek-v4-pro' }}
          # Fallback engine, only used when DeepSeek cannot spend.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Delivery.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          # Optional.
          COGEXT_API_KEY: ${{ secrets.COGEXT_API_KEY }}
          AUTO_APPLY: ${{ vars.AUTO_APPLY || 'false' }}
          AUTO_APPLY_MIN_SCORE: ${{ vars.AUTO_APPLY_MIN_SCORE || '8' }}
          MAX_JOBS_PER_RUN: ${{ vars.MAX_JOBS_PER_RUN || '60' }}
          # Task-based / no-interview targeting.
          NO_INTERVIEW_ONLY: ${{ vars.NO_INTERVIEW_ONLY || 'true' }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '72' }}
          LOOKBACK_HOURS_TASK: ${{ vars.LOOKBACK_HOURS_TASK || '2160' }}
          FREELANCE_MIN_BUDGET: ${{ vars.FREELANCE_MIN_BUDGET || '50' }}
          FREELANCE_MAX_BIDS: ${{ vars.FREELANCE_MAX_BIDS || '120' }}
        run: |
          set -euo pipefail
          case "${{ inputs.mode || 'run' }}" in
            self-test) echo "Mode: self-test"; python job_agent.py --self-test ;;
            dry-run)   echo "Mode: dry-run";   python job_agent.py --dry-run ;;
            *)         echo "Mode: run";       python job_agent.py ;;
          esac

      - name: Commit and push jobs_log.csv
        if: ${{ (inputs.mode || 'run') == 'run' }}
        run: |
          set -euo pipefail

          git config user.name  "job-agent-bot"
          git config user.email "job-agent-bot@users.noreply.github.com"

          if git diff --quiet -- jobs_log.csv 2>/dev/null && \
             git diff --cached --quiet -- jobs_log.csv 2>/dev/null && \
             [ -z "$(git ls-files --others --exclude-standard -- jobs_log.csv)" ]; then
            echo "jobs_log.csv unchanged - nothing to commit"
            exit 0
          fi

          git add jobs_log.csv
          git commit -m "Update jobs_log.csv [skip ci]" || {
            echo "Nothing to commit"
            exit 0
          }

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Pushing to branch: $BRANCH"

          for i in 1 2 3; do
            echo "Attempt $i: git fetch + rebase + push"
            git fetch origin "$BRANCH"
            if git pull --rebase origin "$BRANCH"; then
              if git push origin "$BRANCH"; then
                echo "Push succeeded"
                exit 0
              fi
            fi
            echo "Pull/push failed (race?). Waiting and retrying..."
            sleep $((i * 5))
          done

          echo "Failed to push after retries"
          exit 1

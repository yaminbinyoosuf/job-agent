permissions:
  contents: write

name: Job Search Agent
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python job_agent.py

      - name: Commit updated log
        run: |
          git config user.name "job-agent-bot"
          git config user.email "bot@thryvixai.com"
          git add jobs_log.csv
          git diff --staged --quiet || git commit -m "Update jobs_log.csv [skip ci]"
          git pull --rebase && git push
